appId: com.slg-translator.app
productName: SLG-Translator
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
win:
  target:
    - target: nsis
      arch: [x64]
mac:
  target: [dmg]
nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
